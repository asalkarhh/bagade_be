spring:
  application:
    name: bagade-backend-test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bagade_test}
    username: ${SPRING_DATASOURCE_USERNAME:saurabhasalkar}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: false

app:
  shop:
    name: ${APP_SHOP_NAME:Bagade Clothing}
  first-owner:
    username: ${APP_FIRST_OWNER_USERNAME:}
    password: ${APP_FIRST_OWNER_PASSWORD:}
    display-name: ${APP_FIRST_OWNER_DISPLAY_NAME:Owner}
